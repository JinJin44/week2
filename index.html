<!DOCTYPE html>
<html lang="ja"></html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>メニュー</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-12">
    <h1 class="text-3xl font-bold mb-4 text-center ">メニュー</h1>
    <div class="max-w-4xl w-full mx-auto bg-gray-600 p-8 rounded-lg shadow-lg">
        <p class="text-3xl text-center text-white">Drinks</p>
        <ul class="list-disc list-inside grid grid-cols-2 gap-4 mt-4">
            <li class="text-center text-black font-bold border border-gray-400 rounded-lg p-3 mb-2 bg-white text-gray-900"><img src="./images/images.jpeg" alt="オリジナルコーヒー" class="w-16 h-16 mx-auto mb-2">オリジナルコーヒー（ice/hot）<span class="font-normal">800円</span> </li>
            <li class="text-center text-black font-bold border border-gray-400 rounded-lg p-3 mb-2 bg-white text-gray-900"><img src="./images/ダウンロード.jpeg" alt="アールグレイ" class="w-16 h-16 mx-auto mb-2">アールグレイ              <span class="font-normal">600円</span></li>
            <li class="text-center text-black font-bold border border-gray-400 rounded-lg p-3 mb-2 bg-white text-gray-900"><img src="./images/ダウンロード (1).jpeg" alt="レモンチィー" class="w-16 h-16 mx-auto mb-2">レモンチィー                <span class="font-normal">600円</span></li>
            <li class="text-center text-black font-bold border border-gray-400 rounded-lg p-3 mb-2 bg-white text-gray-900"><img src="./images/コーラ.jpeg" alt="コーラ" class="w-16 h-16 mx-auto mb-2">コーラ <span class="font-normal">400円</span></li>
        </ul>
        <div class="border-t border-gray-400 my-4"></div>
        <div class="max-w-2xl mx-auto bg-gray-600 p-6 rounded-lg mt-6">
            <p class="text-3xl text-center text-white">Food</p>
            <ul class="list-disc list-inside grid grid-cols-2 gap-4 mt-4">
                <li class="text-center text-black font-bold border border-gray-400 rounded-lg p-3 mb-2 bg-white text-gray-900"><img src="./images/サンド.jpeg" alt="サンドイッチ" class="w-16 h-16 mx-auto mb-2">サンドイッチ <span class="font-normal">500円</span></li>
                <li class="text-center text-black font-bold border border-gray-400 rounded-lg p-3 mb-2 bg-white text-gray-900"><img src="./images/ドーナツ.jpeg" alt="ドーナツ" class="w-16 h-16 mx-auto mb-2">ドーナツ <span class="font-normal">300円</span></li>
                <li class="text-center text-black font-bold border border-gray-400 rounded-lg p-3 mb-2 bg-white text-gray-900"><img src="./images/アイス.jpeg" alt="ソフトクリーム" class="w-16 h-16 mx-auto mb-2">アイス<span class="font-normal">400円</span></li>
                <li class="text-center text-black font-bold border border-gray-400 rounded-lg p-3 mb-2 bg-white text-gray-900"><img src="./images/バスク.webp" alt="バスクチーズケーキ" class="w-16 h-16 mx-auto mb-2">ケーキ <span class="font-normal">500円</span></li>
            </ul>
        </div>
    </div>
    <h2 class="text-2xl font-bold mt-8 text-center">公式サイト</h2>
    <p class="text-center mt-4">
    <a class="text-blue-500 hover:underline" href="https://www.starbucks.co.jp/" target="_blank" rel="noopener noreferrer">スターバックスコーヒー公式サイト</a>
    </p>
